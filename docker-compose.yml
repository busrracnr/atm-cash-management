name: atm-cash-management

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atm_cash
      POSTGRES_USER: atm
      POSTGRES_PASSWORD: atm_dev_password
    ports:
      # Non-default host port so a locally installed PostgreSQL does not clash.
      - "${DB_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atm -d atm_cash"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/AtmCashManagement.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=atm_cash;Username=atm;Password=atm_dev_password"
    ports:
      - "${API_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
